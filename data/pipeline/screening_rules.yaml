  - QTLs
  - GWAS
  - GRN
  - GRNs
  - SNP
  - SNPs
  - DNA
  - RNA
# I4 / E1: model names that other fields borrow from population genetics. They count as domain evidence,
# but not as evidence that the biological subject outweighs an off-domain subject.
domain_model_terms:
  - wright-fisher
  - wright fisher
  - moran model*
  - coalescent*
  - kimura
  - population genetic*
  - genetic drift
  - fixation probabilit*
  - probability of fixation
domain_weak:           # biological context that supports, but alone does not establish, the scope
  - gene*
  - genetic*
  - evolution*
  - evolutionary
  - population*
  - selection
  - breeding
  - cell*
  - protein*
  - species
  - biolog*
  - biochemical
  - chemical kinetics
  - reaction network*

# E1: the stochastic model is applied outside genetics, evolution, breeding and gene regulation.
# Subject terms name another field; one in the title, with no strong domain term there, excludes the record.
off_domain_subject:
  - language*
  - linguistic*
  - word frequenc*
  - cultural
  - opinion*
  - econom*
  - financ*
  - market*
  - portfolio*
  - wealth
  - stock market*
  - stock price*
  - option pricing
  - quantum
  - nmr
  - spectroscop*
  - astrochemistry
  - polymer*
  - nanocluster*
  - coagulation
  - aggregation of particles
  - material*
  - surname*
  - community detection
  - traffic
  - wireless
  - power grid
  - supply chain
  - robot*
  - image processing
  - image segmentation
  - computer vision
  - hardware
  - random number generator*
  - schema
  - schemata
  - predator-prey
  - lotka-volterra
  - turbulen*
  - plasma
  - semiconductor*
  - seismic
  - archaeolog*
  - neolithic
# Context terms also occur in genetics records (epidemiology with population genetics is in scope); they count
# at half weight and never exclude a record on their own.
off_domain_context:
  - epidemic*
  - epidemiolog*
  - infection*
  - covid*
  - sars-cov*
  - pandemic*
  - social
  - culture
  - climate
  - hydrolog*
  - fluid*
  - image*
off_domain_context_weight: 0.5

# E6: document types that are not substantive articles (matched against the document type field)
excluded_document_types:
  - erratum
  - correction
  - retraction
  - retracted
  - editorial
  - note
  - letter
  - meeting abstract
  - conference abstract

min_abstract_words: 50

# Decision levels (see 02_screen_records.py for how they combine)
levels:
  domain_strong_for_include: 2      # weighted strong-domain score that establishes the scope (I4)
  domain_weak_support: 2            # weak terms that, with one strong term and a named model, establish it
  domain_weak_alone: 3              # weak terms that, with a named model and no off-domain term, establish it
  off_domain_dominates: 2           # off-domain score at least this, and not below the biological domain score, excludes (E1)
  off_domain_keeps_maybe: 4         # ...unless the biological domain score reaches this: then Maybe
  population_genetics_without_model: 6   # biological domain score at which a record with no stochastic term is Maybe, not Exclude
