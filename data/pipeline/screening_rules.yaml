  - diffusion process*
  - diffusion limit*
  - diffusion operator*
  - diffusion equation*
  - kimura diffusion
  - kolmogorov equation*
  - forward-in-time
  - stochastic hybrid
  - branching process*
  - galton-watson
  - birth-death process*
  - birth and death process*
  - stochastic differential equation*
  - stochastic partial differential equation*
  - langevin
  - ornstein-uhlenbeck
  - brownian motion
  - random walk*
  - gillespie
  - stochastic simulation*
  - stochastic model*
  - stochastic process*
  - stochastic dynamic*
  - stochastic gene expression
  - stochastic switching
  - linear noise approximation
  - van kampen
  - moment closure
  - markov chain*
  - markov process*
  - markov model*
  - poisson process*
  - point process*
  - hamilton-jacobi-bellman
  - stochastic optimal control
  - stochastic control
  - mean-field game*
  - mean field game*
  - ising
  - potts model*
  - score-based
  - neural sde*
  - genetic drift
  - random drift
  - fixation probabilit*
  - probability of fixation
  - gene expression noise
  - intrinsic noise
  - extrinsic noise
stochastic_weak:
  - stochastic*
  - random*
  - noise
  - noisy
  - fluctuation*
  - probabilistic
  - probability
  - monte carlo
  - drift
  - simulation*
  - simulated
case_sensitive_stochastic:
  - SDE
  - SDEs
  - CME
  - SSA
  - HJB

