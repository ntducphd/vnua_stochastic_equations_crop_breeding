# Screening rules for title-and-abstract screening (read by pipeline/02_screen_records.py).
#
# Each term list implements one criterion of ../protocol/eligibility_criteria.md. Terms are matched in lower case
# on whole words; a trailing * matches any word ending ("genom*" matches genome, genomes, genomic). Abbreviations
# under `case_sensitive` are matched exactly as written. Phrases listed under `mask` are removed before matching,
# so that a word used in another sense (a genetic algorithm, the coalescence of particles) does not count.
# Change a list only together with `version`; the screening output records this file's SHA-256.

version: "1.2 (2026-10-19)"

fields:            # weight of a hit by field; keywords are author keywords plus Scopus Index Keywords
  title: 2
  keywords: 2
  abstract: 1

mask_off_domain:   # removed before matching and counted as off-domain evidence (E1, E2): computing senses
  - genetic algorithm*
  - evolutionary algorithm*
  - evolutionary computation
  - evolutionary optimi*
  - genetic programming
  - gene expression programming
  - particle swarm*
  - large language model*
  - language model*
mask:              # removed before matching (other senses of genetics or model words)
  - time evolution
  - evolution equation*
  - evolution operator*
  - evolution of the system
  - temporal evolution
  - hereditary effect*
  - hereditary system*
  - systems with heredity
  - coalescence
  - coalescing particle*
  - branching morphogenesis
  - branching structure*

